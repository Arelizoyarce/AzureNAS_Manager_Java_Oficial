<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><title>Búsqueda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; margin: 0; }
        .sidebar { width: 250px; background-color: #eef2f7; min-height: 100vh; border-right: 1px solid #dee2e6; position: fixed; }
        .sidebar .nav-link { color: #333; padding: 15px 20px; font-weight: 500; border-left: 4px solid transparent; }
        .sidebar .nav-link.active { background-color: #e2e8f0; border-left: 4px solid #0b3d91; color: #0b3d91; }
        .main-content { margin-left: 250px; padding: 20px; }
        .topbar { background-color: #0b3d91; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
    </style>
</head>
<body>
    <div class="sidebar d-flex flex-column">
        <div class="p-3 mb-3 border-bottom"><h5 class="fw-bold" style="color: #0b3d91;"><i class="fas fa-cloud"></i> AzureNAS</h5></div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/explorador"><i class="fas fa-folder-open"></i> Explorador</a></li>
            <li class="nav-item"><a class="nav-link active" href="/busqueda"><i class="fas fa-search"></i> Búsqueda</a></li>
            <li class="nav-item"><a class="nav-link" href="/transferencias"><i class="fas fa-exchange-alt"></i> Transferencias</a></li>
            
            <!-- SOLO EL ADMIN PUEDE VER AUDITORÍA Y ADMIN -->
            <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                <a class="nav-link" href="/auditoria"><i class="fas fa-history"></i> Auditoría</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                <a class="nav-link" href="/admin"><i class="fas fa-user-shield"></i> Panel Admin</a>
            </li>
        </ul>
    </div>
    <div class="main-content">
        <div class="topbar">
            <div><i class="fas fa-search"></i> Búsqueda Avanzada</div>
            <div>
                <i class="fas fa-user-circle me-1"></i> 
                <span class="fw-bold me-3" th:if="${usuarioLogueado != null}" th:text="${usuarioLogueado.nombres}">Usuario</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Salir</a>
            </div>
        </div>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form action="/busqueda" method="GET" class="row g-3">
                    <div class="col-md-5">
                        <label class="fw-bold">Nombre del Archivo:</label>
                        <input type="text" name="q" class="form-control" placeholder="Ej: informe..." th:value="${query}">
                    </div>
                    <div class="col-md-3">
                        <label class="fw-bold">Extensión:</label>
                        <select name="ext" class="form-select">
                            <option value="">Todas</option>
                            <option value=".pdf">.pdf</option>
                            <option value=".docx">.docx</option>
                            <option value=".xlsx">.xlsx</option>
                            <option value=".zip">.zip</option>
                        </select>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100" style="background-color: #0b3d91;">Buscar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover mb-0">
                    <thead><tr><th>NOMBRE DEL ARCHIVO</th><th>ESTADO</th><th>ACCIÓN</th></tr></thead>
                    <tbody>
                        <tr th:each="r : ${resultados}">
                            <td class="fw-bold" th:text="${r}"></td>
                            <td><span class="badge bg-success">Encontrado</span></td>
                            <td><a href="/explorador" class="btn btn-sm btn-outline-primary">Ir a carpeta</a></td>
                        </tr>
                    </tbody>
                </table>
                <p th:if="${#lists.isEmpty(resultados)}" class="text-muted mt-3 mb-0">No se encontraron archivos.</p>
            </div>
        </div>
    </div>
</body>
</html>
