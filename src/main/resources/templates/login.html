<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f6f9;display:flex;justify-content:center;align-items:center;height:100vh;}.card{border-top:5px solid #0b3d91;}</style></head>
<body><div class="card p-4 shadow-sm" style="width:350px;">
<h3 class="text-center text-primary">AzureNAS</h3>
<form action="/login" method="POST">
<label>Correo:</label><input type="email" name="username" class="form-control mb-2" required>
<label>Contraseña:</label><input type="password" name="password" class="form-control mb-3" required>
<button type="submit" class="btn btn-primary w-100" style="background:#0b3d91;">Ingresar</button>
</form></div></body></html>
